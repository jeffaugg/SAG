version: '3.8'

services:
  db:
    image: postgres:16
    container_name: mydb
    restart: always
    ports:
      - "5344:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:  ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sag_network
  

  redis:
    image: redis:6.2
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}"
    ]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    container_name: myredis
    restart: always
    ports:
      - "7008:6379"
    volumes:
      - redis_data:/data
    networks:
      - sag_network

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - sag_network
    
  mongo:
    image: mongo:6.0
    container_name: mymongo
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - sag_network
  
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: >
      sh -c "
        minio server /data --console-address :9001 &
        sleep 5 &&
        mc alias set local http://localhost:9000 \
          $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/atendimentos
      "
    networks:
      - sag_network

        
volumes:
  postgres-data:
  redis_data:
  mongo_data:
  minio_data:
networks:
  sag_network:
    driver: bridge  