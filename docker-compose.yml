version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
      - mongo
      - minio
    networks:
      - sag_network

  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
      args:
        VITE_API_END_POINT: ${VITE_API_END_POINT}
    container_name: front
    restart: always
    ports:
      - "4173:4173"
    depends_on:
      - api
    networks:
      - sag_network

  db:
    image: postgres:16
    container_name: mydb
    restart: always
    ports:
      - "5344:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:  ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sag_network
  

  redis:
    image: redis:6.2
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--port", "7008"
    ]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    container_name: myredis
    restart: always
    ports:
      - "7008:7008"
    volumes:
      - redis_data:/data
    networks:
      - sag_network

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - sag_network
    
  mongo:
    image: mongo:6.0
    container_name: mymongo
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - sag_network
  
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: ["server","/data","--console-address",":9001"]
    networks:
      - sag_network

        
volumes:
  postgres-data:
  redis_data:
  mongo_data:
  minio_data:
networks:
  sag_network:
    driver: bridge  